<div class="box-model">
<h3>Інтерактивний CSS Box Model</h3>
<p class="demo-note">Змінюй ширину, внутрішній відступ і рамку. Обидві смуги мають спільний масштаб.</p>
<form data-box-form>
<label>Width <output data-box-value="width">200 px</output></label>
<input type="range" name="width" min="80" max="360" value="200" aria-label="Width">
<label>Padding з кожного боку <output data-box-value="padding">20 px</output></label>
<input type="range" name="padding" min="0" max="60" value="20" aria-label="Padding">
<label>Border з кожного боку <output data-box-value="border">5 px</output></label>
<input type="range" name="border" min="0" max="20" value="5" aria-label="Border">
<button type="reset">Скинути розміри</button>
</form>
<div class="box-model-results" aria-live="polite">
<section data-box-model="content">
<h4><code>box-sizing: content-box</code></h4>
<div class="box-model-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<p>Зовнішня ширина <strong data-outer>250 px</strong>, ширина вмісту <strong data-inner>200 px</strong>.</p>
</section>
<section data-box-model="border">
<h4><code>box-sizing: border-box</code></h4>
<div class="box-model-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<p>Зовнішня ширина <strong data-outer>200 px</strong>, ширина вмісту <strong data-inner>150 px</strong>.</p>
</section>
</div>
<ul class="box-model-legend" aria-label="Кольори схеми"><li>Content</li><li>Padding</li><li>Border</li></ul>
</div>
